# THIS FILE WAS GENERATED BY CARGO, then changed for publishing under this
# crate's own name. See Cargo.toml.orig for upstream's own manifest, and
# VENDORED.md for every change made here.

[package]
edition = "2024"
# vendored: published to crates.io under its own name (see VENDORED.md);
# the library is still named `mermaid_rs_renderer` (`[lib]` below).
name = "markdoc-mermaid-renderer"
version = "0.3.2"
authors = ["mermaid-rs-renderer contributors"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure-Rust Mermaid renderer: upstream mermaid-rs-renderer 0.3.1 with added diagram types and fixes (see VENDORED.md)"
readme = "VENDORED.md"
keywords = [
    "mermaid",
    "diagram",
    "svg",
    "renderer",
]
categories = ["visualization"]
license = "MIT"
repository = "https://github.com/markdoc-rs/markdoc-mermaid"
# `cargo package` writes its own Cargo.toml.orig and refuses a package that
# already has one.
exclude = ["Cargo.toml.orig"]

[lib]
name = "mermaid_rs_renderer"
path = "src/lib.rs"

[[example]]
name = "flowchart_visual_report"
path = "examples/flowchart_visual_report.rs"

[[example]]
name = "port_quality"
path = "examples/port_quality.rs"

[[test]]
